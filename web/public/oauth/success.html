<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth Success</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.95rem;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>Authentication Successful!</h1>
        <p>You can now close this window<span class="spinner"></span></p>
    </div>

    <script>
        // Extract provider from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const provider = urlParams.get('provider') || 'google';
        
        // Map provider codes to friendly names
        const providerNames = {
            'google': 'Google',
            'googleads': 'Google Ads',
            'facebookads': 'Facebook Ads',
            'bigquery': 'BigQuery',
            'googlesheets': 'Google Sheets',
            'mysql': 'MySQL'
        };
        
        const displayName = providerNames[provider.toLowerCase()] || provider;
        
        // Update UI
        document.querySelector('h1').textContent = `${displayName} Connected!`;

        // Send success message to parent window
        if (window.opener) {
            try {
                window.opener.postMessage({
                    type: 'oauth_success',
                    provider: provider,
                    timestamp: Date.now()
                }, window.location.origin);
            } catch (error) {
                console.error('Failed to send message to parent:', error);
            }
        }

        // Auto-close after 2 seconds
        setTimeout(() => {
            try {
                window.close();
            } catch (error) {
                // Some browsers prevent closing windows that weren't opened by script
                console.log('Window close prevented by browser');
            }
        }, 2000);

        // Handle potential errors from URL
        const error = urlParams.get('error');
        if (error) {
            document.querySelector('.success-icon').textContent = '❌';
            document.querySelector('h1').textContent = 'Connection Failed';
            document.querySelector('p').innerHTML = `Error: ${error}`;
            
            if (window.opener) {
                window.opener.postMessage({
                    type: 'oauth_error',
                    error: error,
                    timestamp: Date.now()
                }, window.location.origin);
            }
        }
    </script>
</body>
</html>
