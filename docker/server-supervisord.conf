[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:uvicorn]
command=/app/.venv/bin/uvicorn server.main:app --host 0.0.0.0 --port 8080
directory=/app/server
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:prefect-worker]
command=/app/.venv/bin/prefect worker start --pool %(ENV_PREFECT_WORK_POOL)s --type process
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
