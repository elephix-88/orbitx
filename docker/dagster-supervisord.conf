[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:dagster-webserver]
command=/app/.venv/bin/dagster-webserver -h 0.0.0.0 -p 3000 -w /app/dagster/workspace.yaml
directory=/app/dagster
environment=DAGSTER_HOME="/app/dagster"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:dagster-daemon]
command=/app/.venv/bin/dagster-daemon run -w /app/dagster/workspace.yaml
directory=/app/dagster
environment=DAGSTER_HOME="/app/dagster"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
