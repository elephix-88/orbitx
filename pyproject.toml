[project]
name = "orbitx"
version = "0.1.0"
description = "OrbitX marketing data integration platform"
requires-python = ">=3.13"
dependencies = [
    "common",
    "engine",
    "server",
    "sse-starlette==3.3.4",
]

[tool.uv.sources]
common = { workspace = true }
engine = { workspace = true }
server = { workspace = true }

[tool.uv.workspace]
members = ["common", "server", "engine"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E713", "E221", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["common", "server", "engine"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_return_any = true
strict_optional = true
show_error_codes = true

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "pytest>=9.0.2",
]
