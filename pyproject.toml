[project]
name = "orbitx"
version = "0.1.0"
description = "OrbitX marketing data integration platform"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["common", "server", "engine"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E713", "E221"]

[tool.ruff.lint.isort]
known-first-party = ["common", "server", "engine"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_return_any = true
strict_optional = true
show_error_codes = true

[dependency-groups]
dev = [
    "ruff>=0.15.6",
]
