[project]
name = "dagster-orbitx"
version = "0.1.0"
description = "Dagster orchestration for OrbitX workflows"
requires-python = ">=3.13"
dependencies = [
    "common",
    "engine",
    "dagster>=1.10.0",
    "dagster-graphql>=1.10.0",
    "dagster-webserver>=1.10.0",
    "dagster-postgres>=0.26.0",
    "loguru>=0.7.3",
]

[tool.uv.sources]
common = { workspace = true }
engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dagster]
module_name = "dagster_orbitx.definitions"
