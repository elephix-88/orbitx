[project]
name = "server"
version = "0.1.0"
description = "FastAPI server for OrbitX"
requires-python = ">=3.13"
dependencies = [
    "common",
    "engine",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.35.0",
    "dynaconf>=3.2.11",
    "loguru>=0.7.3",
    "pydantic[email]>=2.11.0",
    "email-validator>=2.0.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "google-ads>=28.4.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-cloud-bigquery>=3.0.0",
    "slowapi>=0.1.9",
    "prefect==3.6.24",
    "sse-starlette>=3.3.4",
]

[tool.uv.sources]
common = { workspace = true }
engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "mypy>=1.18.2",
    "types-requests>=2.32.4",
]
