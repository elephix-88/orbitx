services:
  prefect-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=prefect
      - POSTGRES_PASSWORD=prefect
      - POSTGRES_DB=prefect
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-python3.13
    command: prefect server start --host 0.0.0.0
    environment:
      - PREFECT_SERVER_DATABASE_CONNECTION_URL=postgresql+asyncpg://prefect:prefect@prefect-postgres:5432/prefect
    ports:
      - "4200:4200"
    depends_on:
      prefect-postgres:
        condition: service_healthy

  server:
    tty: true
    build:
      context: .
      dockerfile: docker/Dockerfile.server.dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ENV=DEV
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - ./server/server:/app/server/server
      - ./server/configs:/app/server/configs
      - ./common/common:/app/common/common
      - ./engine/engine:/app/engine/engine
      - ./engine/configs:/app/engine/configs
    depends_on:
      - prefect-server

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web.dev
    ports:
      - "5173:5173"
    env_file:
      - web/.env
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/index.html:/app/index.html
      - ./web/tailwind.config.js:/app/tailwind.config.js
      - ./web/postcss.config.js:/app/postcss.config.js
      - ./web/vite.config.ts:/app/vite.config.ts
      - ./web/tsconfig.json:/app/tsconfig.json
