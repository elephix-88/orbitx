services:
  # ── Development ────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server.dev
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ENV=DEV
    volumes:
      - ./server/server:/app/server/server
      - ./server/configs:/app/server/configs
      - ./common/common:/app/common/common
    profiles: ["dev"]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web.dev
    ports:
      - "5173:5173"
    env_file:
      - web/.env
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/index.html:/app/index.html
      - ./web/tailwind.config.js:/app/tailwind.config.js
      - ./web/postcss.config.js:/app/postcss.config.js
      - ./web/vite.config.ts:/app/vite.config.ts
      - ./web/tsconfig.json:/app/tsconfig.json
    profiles: ["dev"]

  dagster:
    build:
      context: .
      dockerfile: docker/Dockerfile.dagster
    ports:
      - "3070:3000"
    env_file:
      - .env
    environment:
      - DAGSTER_HOME=/app/dagster
      - DAGSTER_PG_HOST=dagster-postgres
      - DAGSTER_PG_PORT=5432
      - DAGSTER_PG_USERNAME=dagster
      - DAGSTER_PG_PASSWORD=dagster
      - DAGSTER_PG_DB=dagster
    volumes:
      - ./dagster/dagster_orbitx:/app/dagster/dagster_orbitx
      - ./engine/engine:/app/engine/engine
      - ./engine/configs:/app/engine/configs
      - ./common/common:/app/common/common
    depends_on:
      dagster-postgres:
        condition: service_healthy
    profiles: ["dev"]

  dagster-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=dagster
      - POSTGRES_PASSWORD=dagster
      - POSTGRES_DB=dagster
    volumes:
      - dagster-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["dev"]

  # ── Production ─────────────────────────────────────────
  server-prod:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "8080:8080"
    env_file:
      - .env
    profiles: ["prod"]

  web-prod:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "80:80"
    profiles: ["prod"]

  dagster-prod:
    build:
      context: .
      dockerfile: docker/Dockerfile.dagster
    ports:
      - "3070:3000"
    env_file:
      - .env
    environment:
      - DAGSTER_HOME=/app/dagster
      - DAGSTER_PG_HOST=dagster-postgres-prod
      - DAGSTER_PG_PORT=5432
      - DAGSTER_PG_USERNAME=dagster
      - DAGSTER_PG_PASSWORD=dagster
      - DAGSTER_PG_DB=dagster
    depends_on:
      dagster-postgres-prod:
        condition: service_healthy
    profiles: ["prod"]

  dagster-postgres-prod:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=dagster
      - POSTGRES_PASSWORD=dagster
      - POSTGRES_DB=dagster
    volumes:
      - dagster-pg-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["prod"]

volumes:
  dagster-pg-data:
  dagster-pg-data-prod:
